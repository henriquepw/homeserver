server {
    listen 443 ssl;
    http2 on;
    server_name photos.henrique.pw;

    # Only the tunnel sets CF-Connecting-IP: public traffic gets shares only.
    location /share/ {
        set $upstream http://immich-server:2283;
        if ($http_cf_connecting_ip) {
            set $upstream http://immich-public-proxy:3000;
        }
        proxy_pass $upstream$request_uri;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        if ($http_cf_connecting_ip) {
            return 404;
        }
        set $upstream http://immich-server:2283;
        proxy_pass $upstream$request_uri;
        include /etc/nginx/snippets/proxy.conf;
    }
}
