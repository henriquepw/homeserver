name: nginx

networks:
  dnet:
    external: true

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    networks:
      - dnet
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ${APPS_DIR}/nginx/certs:/etc/nginx/certs:ro
    # Periodic reload picks up renewed certs. The alternative (acme --reloadcmd)
    # would need the Docker socket mounted into the acme container.
    command: >
      sh -c "while :; do sleep 12h; nginx -s reload; done &
             exec nginx -g 'daemon off;'"

  # Renewal only (daily cron). Initial issuance is `make certs`.
  acme:
    image: neilpang/acme.sh:latest
    container_name: acme
    restart: unless-stopped
    networks:
      - dnet
    environment:
      - CF_Token=${CF_Token}
    volumes:
      # Must persist: without it every run registers a new ACME account and
      # burns the Let's Encrypt duplicate-cert limit (5/week).
      - ${APPS_DIR}/nginx/acme:/acme.sh
      - ${APPS_DIR}/nginx/certs:/certs
    command: daemon
