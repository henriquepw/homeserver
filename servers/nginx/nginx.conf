user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # nginx defaults to 1 MB, which silently breaks Immich and Komga uploads.
    client_max_body_size 0;

    # Docker's internal DNS. conf.d/ resolves upstreams per-request instead of at
    # boot, so nginx starts regardless of which stacks are up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Only forward "Connection: upgrade" when the client actually asked for it.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Wildcard cert, inherited by every server block in conf.d/.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Covers the 80 -> 443 redirect for every domain at once.
    server {
        listen 80 default_server;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # Unknown host: close without responding, so unconfigured wildcard
    # subdomains expose nothing.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        return 444;
    }

    include /etc/nginx/conf.d/*.conf;
}
