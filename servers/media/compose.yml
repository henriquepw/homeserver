name: "media"

networks:
  dnet:
    external: true

services:
  qbittorrent:
    container_name: qbittorrent
    image: linuxserver/qbittorrent:latest
    restart: unless-stopped
    networks:
      - default
      - dnet
    labels:
      glance.hide: false
      glance.id: qbittorrent
      glance.name: qBittorrent
      glance.icon: si:qbittorrent
      glance.url: https://torrent.henrique.pw
      glance.description: BitTorrent client
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=62609
    volumes:
      - ${APPS_DIR}/qbittorrent/config:/config
      - ${MEDIA_DIR}:/data
    ports:
      # Stays published: torrenting port, must be reachable directly.
      - "62609:62609"
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 60s
      retries: 3
      start_period: 20s
      timeout: 10s

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest
    restart: unless-stopped
    networks:
      - default
      - dnet
    labels:
      glance.hide: false
      glance.id: prowlarr
      glance.name: Prowlarr
      glance.icon: si:prowlarr
      glance.url: https://prowlarr.henrique.pw
      glance.description: Indexer manager
    depends_on:
      - flaresolverr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APPS_DIR}/prowlarr/config:/config

  # No domain, off dnet: headless browser API used only by prowlarr.
  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    labels:
      glance.hide: true
      glance.id: flaresolverr
      glance.name: FlareSolverr
      glance.parent: prowlarr
      glance.description: Cloudflare challenge solver
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
    # Docker's default /dev/shm is too small for Chrome; challenges fail with "tab crashed".
    shm_size: 1gb
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

  radarr:
    container_name: radarr
    image: ghcr.io/linuxserver/radarr:latest
    restart: unless-stopped
    networks:
      - default
      - dnet
    labels:
      glance.hide: false
      glance.id: radarr
      glance.name: Radarr
      glance.icon: si:radarr
      glance.url: https://radarr.henrique.pw
      glance.description: Movies automation
    depends_on:
      - qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APPS_DIR}/radarr/config:/config
      - ${MEDIA_DIR}:/data

  sonarr:
    container_name: sonarr
    image: ghcr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    networks:
      - default
      - dnet
    labels:
      glance.hide: false
      glance.id: sonarr
      glance.name: Sonarr
      glance.icon: si:sonarr
      glance.url: https://sonarr.henrique.pw
      glance.description: TV automation
    depends_on:
      - qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APPS_DIR}/sonarr/config:/config
      - ${MEDIA_DIR}:/data

  lidarr:
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    restart: unless-stopped
    networks:
      - default
      - dnet
    labels:
      glance.hide: false
      glance.id: lidarr
      glance.name: Lidarr
      glance.icon: si:lidarr
      glance.url: https://lidarr.henrique.pw
      glance.description: Music automation
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APPS_DIR}/lidarr:/config
      - ${MEDIA_DIR}:/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

  bazarr:
    container_name: bazarr
    image: ghcr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    networks:
      - default
      - dnet
    labels:
      glance.hide: false
      glance.id: bazarr
      glance.name: Bazarr
      glance.icon: si:bazarr
      glance.url: https://bazarr.henrique.pw
      glance.description: Subtitle manager
    depends_on:
      - radarr
      - sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APPS_DIR}/bazarr/config:/config
      - ${MEDIA_DIR}:/data

  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    networks:
      - default
      - dnet
    labels:
      glance.hide: false
      glance.id: seerr
      glance.name: Seerr
      glance.icon: si:overseerr
      glance.url: https://tvv.henrique.pw
      glance.description: Media requests
    environment:
      - LOG_LEVEL=debug
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    volumes:
      - ${APPS_DIR}/seerr:/app/config

  jackett:
    container_name: jackett
    image: ghcr.io/linuxserver/jackett:latest
    restart: unless-stopped
    networks:
      - default
      - dnet
    labels:
      glance.hide: false
      glance.id: jackett
      glance.name: Jackett
      glance.icon: si:jackett
      glance.url: https://jackett.henrique.pw
      glance.description: Indexer manager
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPS_DIR}/jackett/config:/config

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    restart: unless-stopped
    networks:
      - default
      - dnet
    labels:
      glance.hide: false
      glance.id: nzbget
      glance.name: NZBGet
      glance.icon: si:nzbget
      glance.url: https://nzbget.henrique.pw
      glance.description: Usenet downloader
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APPS_DIR}/nzbget:/config
      - ${MEDIA_DIR}:/data

  fileflows:
    container_name: fileflows
    image: revenz/fileflows:latest
    # Native arm64: skips the amd64 intel driver install that breaks under set -e.
    platform: linux/arm64
    restart: unless-stopped
    networks:
      - default
      - dnet
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APPS_DIR}/fileflows/data:/app/Data
      - ${APPS_DIR}/fileflows/logs:/app/Logs
      - ${APPS_DIR}/fileflows/temp:/temp
      # Same host path as the native macOS node, so no per-node path mapping.
      - ${MEDIA_DIR}:${MEDIA_DIR}
    ports:
      # Stays published despite having a domain: the native macOS node registers
      # at http://127.0.0.1:9960 (see FF_SERVER_URL in the Makefile).
      - "9960:5000"
    labels:
      glance.hide: false
      glance.id: fileflows
      glance.name: FileFlows
      glance.icon: si:fileflows
      glance.url: https://fileflows.henrique.pw
      glance.description: Media transcoding

  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    restart: unless-stopped
    networks:
      - default
      - dnet
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
    volumes:
      - ${APPS_DIR}/navidrome:/data
      - ${MEDIA_DIR}/musics:/music:ro
    labels:
      glance.hide: false
      glance.id: navidrome
      glance.name: Navidrome
      glance.icon: si:navidrome
      glance.url: https://music.henrique.pw
      glance.description: Music streaming

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      # Stays published: LAN client discovery, not HTTP.
      - 7360:7359/udp
    volumes:
      - ${APPS_DIR}/jellyfin/config:/config
      - ${APPS_DIR}/jellyfin/cache:/cache
      - type: bind
        source: ${MEDIA_DIR}/videos
        target: /media/videos
      - type: bind
        source: ${MEDIA_DIR}/books
        target: /media/books
      - type: bind
        source: ${MEDIA_DIR}/mangas
        target: /media/mangas
      - type: bind
        source: ${MEDIA_DIR}/fonts
        target: /usr/local/share/fonts/custom
        read_only: true
    restart: "unless-stopped"
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - dnet
    labels:
      glance.hide: false
      glance.id: jellyfin
      glance.name: Jellyfin
      glance.icon: si:jellyfin
      glance.url: https://tv.henrique.pw
      glance.description: Movies & shows

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: suwayomi
    restart: unless-stopped
    environment:
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:8191
    networks:
      - default
      - dnet
    volumes: # The order matters! Make sure the downloads is first in the volume list or it will not work!
      - ${MEDIA_DIR}/mangas:/home/suwayomi/.local/share/Tachidesk/downloads
      - ${MEDIA_DIR}/tachidesk:/home/suwayomi/.local/share/Tachidesk
    labels:
      glance.hide: false
      glance.id: suwayomi
      glance.name: Suwayomi
      glance.icon: si:suwayomi
      glance.url: https://manga.henrique.pw
      glance.description: Manga Downloader
