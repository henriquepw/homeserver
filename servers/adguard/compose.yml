name: adguard

networks:
  dnet:
    external: true

services:
  adguard:
    image: adguard/adguardhome
    container_name: adguard
    restart: unless-stopped

    env_file: ../../.env

    networks:
      - dnet

    labels:
      glance.hide: false
      glance.id: adguard
      glance.name: AdGuard Home
      glance.icon: si:adguard
      glance.url: https://dns.henrique.pw
      glance.description: DNS filtering and blocking

    volumes:
      - ${APPS_DIR}/adguard/data:/opt/adguardhome/work
      - ${APPS_DIR}/adguard/config:/opt/adguardhome/conf

    ports:
      # Stays published: LAN resolver, not HTTP, never goes through nginx.
      - "53:53/tcp"
      - "53:53/udp"
